name: EXE bauen
on:
  workflow_dispatch:      # Start per Button "Run workflow" im Browser
  push:
    paths: ["roblox_portable.py", ".github/workflows/build-exe.yml"]

permissions:
  contents: write         # nötig, um das Release zu veröffentlichen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python test_roblox_portable.py
      - name: PyInstaller (onedir, ohne Admin-Manifest)
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onedir --windowed --name RobloxPortable roblox_portable.py
      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/RobloxPortable -DestinationPath RobloxPortable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxPortable
          path: dist/RobloxPortable
      - name: Öffentliches Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest RobloxPortable.zip --title "RobloxPortable (Windows)" --notes "Entpacken und RobloxPortable.exe starten. Kein Admin nötig." --latest
